<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Per base plots</title>
    <style>
        .galeria {
            display: flex;
            gap: 20px;
            justify-content: center;
            padding: 20px;
            flex-direction: column;
        }
        figure {
            text-align: center;
            margin: 0;
            max-width: 1000px;
        }
        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
        }
        table {
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px 16px;
            text-align: left;
        }
        thead tr {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr><th>Base</th><th>n</th><th>d</th></tr>
        </thead>
        <tbody>
            <tr><td>wine</td><td>178</td><td>13</td></tr>
            <tr><td>land_mines</td><td>338</td><td>3</td></tr>
            <tr><td>ecoli</td><td>336</td><td>7</td></tr>
            <tr><td>ukm</td><td>403</td><td>5</td></tr>
            <tr><td>wholesale</td><td>440</td><td>7</td></tr>
        </tbody>
    </table>
    <div class="galeria">
        <figure>
            <img src="avg_rhst/rhst_ecoli_avg_ratio_vs_mis_radius.png" alt="Ecoli dataset">
            <figcaption>Ratio between the k-medians cost of each method and that of msi on the Ecoli dataset.</figcaption>
        </figure>

        <figure>
            <img src="avg_rhst/rhst_land_mines_avg_ratio_vs_mis_radius.png" alt="LandMines dataset">
            <figcaption>Ratio between the k-medians cost of each method and that of msi on the LandMines dataset.</figcaption>
        </figure>

        <figure>
            <img src="avg_rhst/rhst_ukm_avg_ratio_vs_mis_radius.png" alt="UKM dataset">
            <figcaption>Ratio between the k-medians cost of each method and that of msi on the UKM dataset.</figcaption>
        </figure>

        <figure>
            <img src="avg_rhst/rhst_wholesale_avg_ratio_vs_mis_radius.png" alt="WholeSale dataset">
            <figcaption>Ratio between the k-medians cost of each method and that of msi on the WholeSale dataset.</figcaption>
        </figure>

        <figure>
            <img src="avg_rhst/rhst_wine_avg_ratio_vs_mis_radius.png" alt="Wine dataset">
            <figcaption>Ratio between the k-medians cost of each method and that of msi on the Wine dataset.</figcaption>
        </figure>
    </div>

</body>
</html>
